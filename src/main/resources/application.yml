spring:
  application:
    name: logistics-transport-api

  # Database Configuration
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        default_schema: public
    open-in-view: false

  # Flyway Migration
  flyway:
    enabled: false
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    table: flyway_schema_history

  # Redis Configuration
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
    password: ${REDIS_PASSWORD}
    database: ${REDIS_DATABASE:0}
    timeout: 60000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

  # Security OAuth2 Configuration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            authorization-grant-type: authorization_code
            redirect-uri: ${GOOGLE_REDIRECT_URI}
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

  # Mail Configuration
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # Message Source (i18n)
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
    use-code-as-default-message: true
    cache-duration: 3600

# Server Configuration
server:
  port: ${PORT:8080}
  servlet:
    context-path: /
  error:
    include-stacktrace: never
    include-message: always
    include-binding-errors: always
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800}
  issuer: logistics-application
  audience: logistics-api

# Logging Configuration
logging:
  level:
    root: INFO
    com.inkfront.logisticsApplication: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.hibernate: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/logistics-application.log
    max-size: 10MB
    max-history: 30
    total-size-cap: 100MB

# Management/Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: logistics-transport-api

# Swagger/OpenAPI
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    display-request-duration: true
    groups-order: DESC
    operationsSorter: method
    tagsSorter: alpha
    try-it-out-enabled: true
    filter: true

# CORS Configuration
cors:
  allowed:
    origins: ${CORS_ALLOWED_ORIGINS}
    methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
    headers: Authorization,Content-Type,X-Requested-With,Accept,Origin,Access-Control-Request-Method,Access-Control-Request-Headers

# Rate Limiting
rate:
  limit:
    enabled: false
    default:
      limit: 100
      window: 60

# OAuth2 Redirect URI
oauth2:
  redirect:
    uri: ${OAUTH2_REDIRECT_URI}

# SMS Configuration
sms:
  provider: ${SMS_PROVIDER}
  api:
    key: ${SMS_API_KEY}
    secret: ${SMS_API_SECRET}
  from:
    number: ${SMS_FROM_NUMBER}

# Payment Gateway
payment:
  provider: ${PAYMENT_PROVIDER}
  paystack:
    secret-key: ${PAYSTACK_SECRET_KEY}
    public-key: ${PAYSTACK_PUBLIC_KEY}
    callback-url: ${PAYSTACK_CALLBACK_URL}
  flutterwave:
    public-key: ${FLUTTERWAVE_PUBLIC_KEY}
    secret-key: ${FLUTTERWAVE_SECRET_KEY}
    encryption-key: ${FLUTTERWAVE_ENCRYPTION_KEY}

# Google Maps
google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY}

# Application Specific
app:
  name: Logistics Transport System
  version: 1.0.0
  base-url: ${APP_BASE_URL}
  frontend-url: ${FRONTEND_URL}
  verification:
    token:
      expiry:
        hours: 24
  password:
    reset:
      token:
        expiry:
          minutes: 15
  rate:
    limit:
      enabled: true
      max-requests: 100
      window-seconds: 60
  file:
    upload:
      max-size: 5MB
      allowed-extensions: jpg,jpeg,png,pdf,doc,docx
      directory: ${FILE_UPLOAD_DIR:uploads}