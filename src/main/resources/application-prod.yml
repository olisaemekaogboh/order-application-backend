spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
    password: ${REDIS_PASSWORD}

logging:
  level:
    root: WARN
    com.inkfront.logisticsApplication: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN

rate:
  limit:
    enabled: true

server:
  port: 8080
  servlet:
    session:
      cookie:
        secure: true

cors:
  allowed:
    origins: ${CORS_ALLOWED_ORIGINS}

app:
  base-url: ${APP_BASE_URL}
  frontend-url: ${FRONTEND_URL}

management:
  endpoints:
    web:
      exposure:
        include: health,info